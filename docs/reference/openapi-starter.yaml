openapi: 3.1.0
info:
  title: PlamoScale & GunplaJunkies Multi-Tenant API
  version: 1.0.0
  description: >
    Central Multi-Tenant REST API powering plamoscale.com (General Scale Modeling),
    gunplajunkies.com (Gunpla, Mecha & Sci-Fi), and future white-label hobby club and shop portals.
    Supports Dual Authentication (Username/Password + Google OAuth 2.0 / OIDC SSO) and
    multi-domain transactional emails via Resend.com.
  contact:
    name: Roberto Pineda (x-codec)
    url: https://x-codec.net
    email: rpineda@x-codec.net
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.plamoscale.com
    description: Production API (PlamoScale primary)
  - url: https://api.gunplajunkies.com
    description: Production API (GunplaJunkies alias)
tags:
  - name: Health
    description: System readiness and operational probes
  - name: Tenants
    description: Multi-tenant portal configuration and resolution
  - name: Auth
    description: Dual Authentication (Local Username/Password + Google SSO OAuth 2.0 / OIDC)
  - name: Builders
    description: Builder profiles and migrated legacy portfolios
  - name: Notifications
    description: Multi-domain email notifications and contact via Resend.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantSlugHeader:
      name: X-Tenant-Slug
      in: header
      required: false
      description: Active tenant identifier (e.g. plamoscale, gunplajunkies)
      schema:
        type: string
        default: plamoscale
  schemas:
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        invalidParams:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
    Tenant:
      type: object
      required:
        - id
        - slug
        - name
        - domain
        - emailFrom
        - allowedCategories
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        domain:
          type: string
        emailFrom:
          type: string
        tagline:
          type: string
        mission:
          type: string
        vision:
          type: string
        allowedCategories:
          type: array
          items:
            type: string
        themeConfig:
          type: object
        createdAt:
          type: string
          format: date-time
    UserProfile:
      type: object
      required:
        - id
        - username
        - displayName
        - email
        - roles
        - authProviders
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        authProviders:
          type: array
          items:
            type: string
            enum: [local, google]
        primaryTenantSlug:
          type: string
        socialLinks:
          type: array
          items:
            type: string
        photoCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required:
        - token
        - authMethod
        - tenant
        - user
      properties:
        token:
          type: string
        authMethod:
          type: string
          enum: [local, google]
        accountLinked:
          type: boolean
        tenant:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: System health and seed state verification
      responses:
        '200':
          description: Healthy API state
  /api/v1/tenants:
    get:
      tags: [Tenants]
      summary: List registered multi-tenant portals
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated tenant list
  /api/v1/tenants/current:
    get:
      tags: [Tenants]
      summary: Resolve active tenant configuration from X-Tenant-Slug or Host
      parameters:
        - $ref: '#/components/parameters/TenantSlugHeader'
      responses:
        '200':
          description: Active tenant metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          description: Unknown tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/registrations:
    post:
      tags: [Auth]
      summary: Register a new builder account with Username/Email and Password
      parameters:
        - $ref: '#/components/parameters/TenantSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                displayName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: Builder registered and welcome email queued via Resend.com
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Duplicate username or email
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/sessions:
    post:
      tags: [Auth]
      summary: Sign in with Username or Email and Password
      parameters:
        - $ref: '#/components/parameters/TenantSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Username or email address
                password:
                  type: string
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/google-sessions:
    post:
      tags: [Auth]
      summary: Sign in or register via Google SSO (OAuth 2.0 / OIDC) with automatic email account linking
      parameters:
        - $ref: '#/components/parameters/TenantSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Google OIDC ID Token
      responses:
        '200':
          description: Authenticated via Google SSO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid Google token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated builder profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/builders:
    get:
      tags: [Builders]
      summary: List builder profiles and migrated legacy portfolios
      parameters:
        - $ref: '#/components/parameters/TenantSlugHeader'
      responses:
        '200':
          description: Paginated builder profiles
  /api/v1/builders/{username}:
    get:
      tags: [Builders]
      summary: Get builder portfolio and migrated build photos by username
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Builder profile with photos and social links
        '404':
          description: Builder not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/notifications/contact-messages:
    post:
      tags: [Notifications]
      summary: Send a tenant-branded contact or subscription email via Resend.com
      parameters:
        - $ref: '#/components/parameters/TenantSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, message]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                message:
                  type: string
      responses:
        '201':
          description: Email dispatched via Resend.com using active tenant domain
  /api/v1/catalog/kits:
    get:
      tags: [Catalog]
      summary: List scale model kits filtered by category, brand, scale, or keyword (scoped to tenant)
      parameters:
        - $ref: '#/components/parameters/TenantSlugHeader'
        - name: category
          in: query
          schema:
            type: string
        - name: brand
          in: query
          schema:
            type: string
        - name: scale
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of kits
    post:
      tags: [Catalog]
      summary: Create a kit manually in the catalog
      parameters:
        - $ref: '#/components/parameters/TenantSlugHeader'
      responses:
        '201':
          description: Kit created
        '200':
          description: Existing kit returned
  /api/v1/catalog/kits/{id}:
    get:
      tags: [Catalog]
      summary: Get kit details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Kit details
        '404':
          description: Kit not found
  /api/v1/catalog/kits/{id}/model-3d:
    get:
      tags: [Catalog]
      summary: Get 3D asset metadata, diorama presets, real and physical scale dimensions for a kit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 3D model metadata and scale dimensions
        '404':
          description: Kit not found
  /api/v1/catalog/models-3d:
    get:
      tags: [Catalog]
      summary: List available 3D models for diorama studio and inspection
      responses:
        '200':
          description: List of 3D models and diorama configurations
  /api/v1/catalog/barcode/{barcode}:
    get:
      tags: [Catalog]
      summary: Lookup kit by barcode (JAN / EAN / UPC / Code-128) with manufacturer prefix hints
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Barcode lookup response
        '400':
          description: Invalid barcode (RFC 7807)
  /api/v1/catalog/kits/import-scalemates:
    post:
      tags: [Catalog]
      summary: Import kit from Scalemates URL with deduplication and 4s graceful fallback
      parameters:
        - $ref: '#/components/parameters/TenantSlugHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scalematesUrl]
              properties:
                scalematesUrl:
                  type: string
                categoryOverride:
                  type: string
      responses:
        '201':
          description: Kit imported
        '200':
          description: Kit already existed
  /api/v1/catalog/paints:
    get:
      tags: [Catalog]
      summary: List paints and supplies by brand, line, type, finish, or color search
      parameters:
        - name: brand
          in: query
          schema:
            type: string
        - name: line
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: finish
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paints list with hex color swatches
    post:
      tags: [Catalog]
      summary: Add new paint reference
      responses:
        '201':
          description: Paint created
  /api/v1/catalog/brands:
    get:
      tags: [Catalog]
      summary: List catalog brands with counts and supported categories
      responses:
        '200':
          description: Brand summaries
  /api/v1/workbench/summary:
    get:
      tags: [Workbench]
      summary: Get personal stash and paint rack statistics for the authenticated builder
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Workbench summary metrics
        '401':
          description: Unauthorized
  /api/v1/workbench/stash:
    get:
      tags: [Workbench]
      summary: List kits in personal stash
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [unbuilt, in_progress, built, wishlist, for_trade]
      responses:
        '200':
          description: Stash items
    post:
      tags: [Workbench]
      summary: Add kit to personal stash
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kitId]
              properties:
                kitId:
                  type: string
                status:
                  type: string
                rating:
                  type: integer
                notes:
                  type: string
                pricePaid:
                  type: number
      responses:
        '201':
          description: Kit added to stash
  /api/v1/workbench/stash/scan:
    post:
      tags: [Workbench]
      summary: Instant stash registration via scanned box barcode
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [barcode]
              properties:
                barcode:
                  type: string
                status:
                  type: string
                  enum: [unbuilt, in_progress, built, wishlist, for_trade]
                notes:
                  type: string
                pricePaid:
                  type: number
                currency:
                  type: string
                kitName:
                  type: string
                brand:
                  type: string
                scale:
                  type: string
                grade:
                  type: string
                category:
                  type: string
      responses:
        '201':
          description: Kit registered and added to stash
        '400':
          description: Validation error
  /api/v1/workbench/stash/export/insurance-summary:
    get:
      tags: [Workbench]
      summary: Get itemized stash insurance and replacement valuation summary
      security:
        - BearerAuth: []
      parameters:
        - name: currency
          in: query
          schema:
            type: string
            default: USD
      responses:
        '200':
          description: Aggregated valuation summary
        '401':
          description: Unauthorized
  /api/v1/workbench/stash/export/insurance-report:
    get:
      tags: [Workbench]
      summary: Generate printable insurance appraisal sheet (HTML/PDF), JSON summary, or CSV file
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [html, json, csv]
            default: html
        - name: currency
          in: query
          schema:
            type: string
            default: USD
        - name: policyNumber
          in: query
          schema:
            type: string
        - name: includeUnbuilt
          in: query
          schema:
            type: boolean
            default: true
        - name: includeBuilt
          in: query
          schema:
            type: boolean
            default: true
        - name: includeInProgress
          in: query
          schema:
            type: boolean
            default: true
        - name: includeWishlist
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Appraisal report or CSV
        '401':
          description: Unauthorized
  /api/v1/workbench/soundscapes/presets:
    get:
      tags: [Workbench]
      summary: List curated procedural ambient soundscapes for workshop focus and painting sessions
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [nature, workshop, scifi, music]
      responses:
        '200':
          description: List of ambient soundscapes
  /api/v1/workbench/soundscapes/presets/{id}:
    get:
      tags: [Workbench]
      summary: Retrieve individual soundscape preset by identifier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Soundscape preset details
        '404':
          description: Preset not found
  /api/v1/workbench/soundscapes/timer-modes:
    get:
      tags: [Workbench]
      summary: List available Pomodoro and focus session timer modes
      responses:
        '200':
          description: List of timer modes
  /api/v1/workbench/airbrush/mediums:
    get:
      tags: [Workbench]
      summary: List supported paint chemistry mediums, techniques, and standard needle sizes
      responses:
        '200':
          description: Mediums, techniques, and needle sizes
  /api/v1/workbench/airbrush/calculate:
    post:
      tags: [Workbench]
      summary: Calculate exact thinner dilution ratio, drops, additives, and compressor PSI/Bar pressure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medium]
              properties:
                medium:
                  type: string
                  enum: [lacquer, acrylic-alcohol, acrylic-water, enamel, polyurethane-primer]
                brand:
                  type: string
                needleSize:
                  type: number
                  default: 0.3
                technique:
                  type: string
                  default: base-coat
                paintDrops:
                  type: number
                  default: 10
      responses:
        '200':
          description: Calculated mixing ratios, drops, PSI ranges, and diagnostic tips
        '400':
          description: Validation error
  /api/v1/workbench/stash/{id}:
    patch:
      tags: [Workbench]
      summary: Update kit in stash
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item updated
        '403':
          description: Forbidden (not the owner)
    delete:
      tags: [Workbench]
      summary: Remove kit from stash
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item removed
  /api/v1/workbench/paints:
    get:
      tags: [Workbench]
      summary: List paints in personal paint rack
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paint rack items
    post:
      tags: [Workbench]
      summary: Add paint to paint rack
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paintId]
              properties:
                paintId:
                  type: string
                quantity:
                  type: integer
                status:
                  type: string
      responses:
        '201':
          description: Paint added to rack
  /api/v1/workbench/paints/{id}:
    patch:
      tags: [Workbench]
      summary: Update paint rack item
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item updated
    delete:
      tags: [Workbench]
      summary: Remove paint from rack
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item deleted
  /api/v1/builds:
    get:
      tags: [Build Logs]
      summary: List build projects feed scoped by tenant allowed categories
      parameters:
        - $ref: '#/components/parameters/TenantSlugHeader'
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: username
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of build projects
    post:
      tags: [Build Logs]
      summary: Create a new step-by-step build project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category]
      responses:
        '201':
          description: Build project created
  /api/v1/builds/{slugOrId}:
    get:
      tags: [Build Logs]
      summary: Get build project details
      parameters:
        - name: slugOrId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Build project details
  /api/v1/builds/{id}/steps:
    post:
      tags: [Build Logs]
      summary: Add step to build project with stage, photos and paint recipes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Step added
  /api/v1/builds/{id}/like:
    post:
      tags: [Build Logs]
      summary: Toggle like for build project
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Like toggled
  /api/v1/builds/{id}/steps:
    post:
      tags: [Build Logs]
      summary: Add a step milestone to a build project with multiple photos
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Step added
  /api/v1/builds/{id}/steps/reorder:
    patch:
      tags: [Build Logs]
      summary: Reorder steps in a build project
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Steps reordered
  /api/v1/builds/{id}/steps/{stepId}:
    patch:
      tags: [Build Logs]
      summary: Update a build step milestone
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: stepId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Step updated
    delete:
      tags: [Build Logs]
      summary: Delete a build step milestone
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: stepId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Step deleted
  /api/v1/builds/{id}/comments:
    post:
      tags: [Build Logs]
      summary: Add comment to build project
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Comment added
  /api/v1/builds/{id}/costs:
    get:
      tags: [Build Logs]
      summary: Get project cost accounting, expenses and commission summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: hourlyRate
          in: query
          required: false
          schema:
            type: number
        - name: currency
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Cost summary retrieved
        '404':
          description: Build not found
    post:
      tags: [Build Logs]
      summary: Add expense item to build project
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Expense item added
        '400':
          description: Validation error
        '403':
          description: Forbidden
        '404':
          description: Build not found
  /api/v1/builds/{id}/costs/{expenseId}:
    delete:
