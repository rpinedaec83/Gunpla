services:
  gunpla-db:
    image: postgres:16-alpine
    container_name: gunpla-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gunpla_usr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gunpla_homelab_pass_2026}
      POSTGRES_DB: ${DB_NAME:-gunpla_prod}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../apps/api/sql/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gunpla_usr} -d ${DB_NAME:-gunpla_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gunpla-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: gunpla-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${DB_USER:-gunpla_usr}:${DB_PASSWORD:-gunpla_homelab_pass_2026}@gunpla-db:5432/${DB_NAME:-gunpla_prod}
      JWT_SECRET: ${JWT_SECRET:-gunpla-plamoscale-sso-dev-secret-2026}
      RESEND_API_KEY: ${RESEND_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-plamoscale-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    ports:
      - "8080:8080"
    depends_on:
      gunpla-db:
        condition: service_healthy

  plamoscale-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.plamoscale-web
    container_name: plamoscale-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://gunpla-api:8080
      GUNPLAJUNKIES_WEB_URL: https://gunplajunkies.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    depends_on:
      - gunpla-api

  gunplajunkies-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gunplajunkies-web
    container_name: gunplajunkies-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      API_URL: http://gunpla-api:8080
      PLAMOSCALE_WEB_URL: https://plamoscale.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3001:3001"
    depends_on:
      - gunpla-api

volumes:
  pgdata:
